<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOps Fundamentals — DevOps Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
<style>
  :root{ --ring-color:#2F81F7; --tc:#2F81F7; }
  body{ background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(47,129,247,0.08), transparent), var(--bg); }
  .hero{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:8px;}
  .section{margin-top:34px; border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden;}
  .section.hidden{display:none;}
  .section-head{display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .section-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16.5px;}
  .star{color:#E3B341; font-size:14px;}
  .section-count{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:3px 10px;}
  .group-tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#0D1117; background:var(--tc); border-radius:5px; padding:2px 7px; letter-spacing:.05em;}
  .section .note, .section .cmdbox, .section .workflow{margin-left:20px; margin-right:20px;}
  .items{padding:6px 8px 16px;}
  .item{display:flex; align-items:flex-start; gap:12px; padding:9px 12px; border-radius:9px; transition:background .12s;}
  .item:hover{background:var(--surface-2);}
  .check{width:20px; height:20px; border-radius:6px; border:2px solid var(--border); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--bg); cursor:pointer; transition:all .15s;}
  .item.done .check{background:var(--tc); border-color:var(--tc);}
  .item-num{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); flex-shrink:0; width:26px; margin-top:2px;}
  .item-body{flex:1; min-width:0;}
  a.item-text{font-size:14.5px; color:var(--text); transition:color .15s;}
  a.item-text:hover{color:var(--tc);}
  .item.done .item-text{color:var(--text-dim);}
  .item-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .item-tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:2px 7px;}
  .opt-tag{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-faint); border:1px solid var(--border); border-radius:5px; padding:1px 6px; margin-left:6px;}
  .item.item-hidden{display:none;}
  .workflow{padding:18px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-top:14px; margin-bottom:18px;}
  .wf-step{display:flex; align-items:center; gap:12px;}
  .wf-dot{width:10px; height:10px; border-radius:50%; background:var(--tc); flex-shrink:0;}
  .wf-text{font-family:'JetBrains Mono',monospace; font-size:13px;}
  .wf-line{width:2px; height:16px; background:var(--tc); opacity:.35; margin-left:4px;}
</style>
</head>
<body>
<div class="wrap narrow">
  <a class="back" href="../../index.html">&larr; BACK TO ROADMAP</a>
  <p class="crumb"><b>Foundations</b> &middot; Topic 1 of 150</p>
  <div class="hero">
    <div>
      <h1>DevOps Fundamentals</h1>
      <p class="sub">The DevOps mindset, lifecycle, practices and terminology — before any tools. Click any item to open its notes, practice, and Q&amp;A.</p>
    </div>
    <div class="ring-wrap">
      <svg class="ring" width="60" height="60" viewBox="0 0 64 64">
        <circle class="ring-track" cx="32" cy="32" r="27"></circle>
        <circle id="ringFill" class="ring-fill" cx="32" cy="32" r="27"></circle>
      </svg>
      <div><div class="ring-num" id="progressNum">0/110</div><div class="ring-label">LEARNED</div></div>
    </div>
  </div>
  <input class="search" id="search" type="text" placeholder="Search within DevOps Fundamentals — e.g. pipeline, rollback, shift-left..." style="margin-top:28px;" />
  <div id="sections"></div>
  <div class="footer"><span class="footer-note">PROGRESS SAVED IN THIS BROWSER &middot; SYNCS WITH THE MAIN ROADMAP</span></div>
</div>
<script src="../../assets/common.js"></script>
<script>
const TOPIC_ID = 1;                          // = topic number on the main roadmap
const CONTENT_SLUG = '001-devops-fundamentals'; // = content/<slug>.json, used for item.html links
const ITEMS_KEY = deTopicItemsKey(TOPIC_ID);

const SECTIONS = [
  {
    title: "1.1 Introduction to DevOps",
    items: [
      { t: "What is DevOps?" },
      { t: "Why DevOps was introduced" },
      { t: "Problems with traditional software delivery" },
      { t: "Development (Dev) vs Operations (Ops)" },
      { t: "DevOps as a culture" },
      { t: "DevOps as a set of practices" },
      { t: "DevOps vs Agile" },
      { t: "DevOps vs traditional IT" },
      { t: "Benefits of DevOps" },
      { t: "Challenges of adopting DevOps" }
    ],
    important: true
  },
  {
    title: "1.2 DevOps Principles and Culture",
    items: [
      { t: "Collaboration and shared responsibility" },
      { t: "Communication between teams" },
      { t: "Breaking Development and Operations silos" },
      { t: "Automation-first mindset" },
      { t: "Infrastructure as Code mindset" },
      { t: "Shift-left approach" },
      { t: "Continuous improvement" },
      { t: "Fast feedback" },
      { t: "Fail fast and recover fast" },
      { t: "Blameless learning culture" },
      { t: "Security and reliability as shared responsibilities" }
    ]
  },
  {
    title: "1.3 The DevOps Lifecycle",
    items: [
      { t: "Plan" },
      { t: "Code" },
      { t: "Build" },
      { t: "Test" },
      { t: "Release" },
      { t: "Deploy" },
      { t: "Operate" },
      { t: "Monitor" },
      { t: "Continuous feedback" }
    ],
    important: true,
    workflow: [
      "Plan",
      "Code",
      "Build",
      "Test",
      "Release",
      "Deploy",
      "Operate",
      "Monitor",
      "Continuous feedback → back to Plan"
    ]
  },
  {
    title: "1.4 Core DevOps Practices",
    items: [
      { t: "Version Control" },
      { t: "Automation" },
      { t: "Continuous Integration (CI)" },
      { t: "Continuous Delivery" },
      { t: "Continuous Deployment" },
      { t: "CI vs Continuous Delivery vs Continuous Deployment" },
      { t: "Continuous Testing" },
      { t: "Infrastructure as Code (IaC)" },
      { t: "Configuration Management" },
      { t: "Infrastructure Automation" },
      { t: "Continuous Monitoring" },
      { t: "Observability: Metrics, Logs and Traces" }
    ],
    important: true
  },
  {
    title: "1.5 DevOps Workflow: Code to Production",
    items: [
      { t: "Developer writes code" },
      { t: "Code repository" },
      { t: "Code review and commit" },
      { t: "Automated build" },
      { t: "Automated testing" },
      { t: "Artifact creation" },
      { t: "Release preparation and approval" },
      { t: "Deployment to an environment" },
      { t: "Infrastructure and runtime environment" },
      { t: "Post-deployment verification" },
      { t: "Monitoring and production support" },
      { t: "Feedback and continuous improvement" }
    ],
    important: true,
    workflow: [
      "Developer writes code",
      "Code repository",
      "Code review and commit",
      "Build",
      "Automated testing",
      "Artifact creation",
      "Release",
      "Deployment",
      "Infrastructure and runtime",
      "Monitoring",
      "Feedback → next improvement"
    ]
  },
  {
    title: "1.6 Essential DevOps Terminology",
    items: [
      { t: "Repository" },
      { t: "Commit" },
      { t: "Branch" },
      { t: "Build" },
      { t: "Artifact" },
      { t: "Pipeline" },
      { t: "Agent" },
      { t: "Runner" },
      { t: "Environment" },
      { t: "Deployment" },
      { t: "Release" },
      { t: "Rollback" },
      { t: "Infrastructure" },
      { t: "Configuration" },
      { t: "Provisioning" }
    ]
  },
  {
    title: "1.7 DevOps Tools Overview",
    items: [
      { t: "Version Control → Git, GitHub, GitLab" },
      { t: "CI/CD → Jenkins, GitHub Actions, GitLab CI" },
      { t: "Containerization → Docker" },
      { t: "Container Orchestration → Kubernetes" },
      { t: "Configuration Management → Ansible" },
      { t: "Infrastructure as Code → Terraform" },
      { t: "Cloud Platforms → AWS, Azure, Google Cloud" },
      { t: "Monitoring → Prometheus, Grafana" },
      { t: "Logging → Elastic Stack" },
      { t: "Security → SonarQube, Trivy, Vault" },
      { t: "GitOps → Argo CD" }
    ],
    note: {
      type: "info",
      text: "Understand the purpose of each tool category first. Hands-on learning of these tools is covered in later topics of the 150-topic roadmap."
    }
  },
  {
    title: "1.8 Practical Case Study: Manual Deployment vs DevOps",
    items: [
      { t: "Scenario: releasing a web application manually" },
      { t: "Problems with manual deployments" },
      { t: "Risks caused by inconsistent environments" },
      { t: "Identify tasks that can be automated" },
      { t: "Automated build and testing" },
      { t: "Creating a versioned artifact" },
      { t: "Deploying the application" },
      { t: "Verifying application health" },
      { t: "Planning rollback and incident response" },
      { t: "Using feedback to prevent repeated failures" }
    ]
  },
  {
    title: "1.9 Knowledge Check and Completion",
    items: [
      { t: "Explain DevOps in your own words" },
      { t: "Describe the DevOps lifecycle in order" },
      { t: "Differentiate CI, Continuous Delivery and Continuous Deployment" },
      { t: "Explain build, artifact, deployment and release" },
      { t: "Explain the importance of monitoring" },
      { t: "Identify the purpose of DevOps tool categories" },
      { t: "Complete the practical case study" },
      { t: "Answer beginner-level DevOps interview questions" },
      { t: "Review the topic completion checklist" }
    ],
    important: true,
    note: {
      type: "success",
      text: "Complete this topic before proceeding to Topic 2: Software Delivery Lifecycle."
    }
  }
];

// global sequential numbering — this n is what item.html?n= and content JSON "n" refer to
let counter = 0;
SECTIONS.forEach(sec => sec.items.forEach(it => { counter++; it.n = counter; }));
const TOTAL = counter;

let progress = deReadStore(ITEMS_KEY);
let query = '';
const NOTE_ICON = {info:'\u24D8', practice:'\u2605', warning:'\u26A0'};

function render(){
  const root = document.getElementById('sections');
  root.innerHTML = '';
  const q = query.trim().toLowerCase();
  SECTIONS.forEach(sec=>{
    const doneCount = sec.items.filter(it=>progress[it.n]).length;
    const match = it => !q || it.t.toLowerCase().includes(q) || (it.tags||[]).some(tg=>tg.toLowerCase().includes(q));
    const secEl = document.createElement('div');
    secEl.className = 'section' + (sec.items.some(match) ? '' : ' hidden');
    secEl.innerHTML = `<div class="section-head">
        <span class="section-title">${sec.title}</span>
        ${sec.important ? '<span class="star" title="Very important">&#9733;</span>' : ''}
        ${sec.group ? `<span class="group-tag">${sec.group}</span>` : ''}
        <span class="section-count">${doneCount}/${sec.items.length}</span></div>`;
    if(sec.intro) secEl.innerHTML += `<div class="note note-${sec.intro.type}"><span>${NOTE_ICON[sec.intro.type]}</span><span>${sec.intro.text}</span></div>`;
    const wrap = document.createElement('div'); wrap.className = 'items';
    sec.items.forEach(it=>{
      const isDone = !!progress[it.n];
      const row = document.createElement('div');
      row.className = 'item' + (isDone?' done':'') + (match(it)?'':' item-hidden');
      row.innerHTML = `<span class="item-num">${it.n}</span>
        <span class="check" data-n="${it.n}">${isDone?'\u2713':''}</span>
        <span class="item-body">
          <a class="item-text" href="../../item.html?topic=${CONTENT_SLUG}&n=${it.n}">${it.t}${it.optional?'<span class="opt-tag">optional</span>':''}<span class="item-arrow">&rarr;</span></a>
          ${it.tags ? `<div class="item-tags">${it.tags.map(tg=>`<span class="item-tag">${tg}</span>`).join('')}</div>` : ''}
        </span>`;
      row.querySelector('.check').addEventListener('click', ()=>toggleItem(it.n));
      wrap.appendChild(row);
    });
    secEl.appendChild(wrap);
    if(sec.commands){
      const box = document.createElement('div'); box.className = 'cmdbox';
      box.innerHTML = `<div class="cmdbox-head"><span class="cmdbox-label">Commands</span><button class="copy-btn">Copy</button></div><pre>${sec.commands.join('\n')}</pre>`;
      box.querySelector('.copy-btn').addEventListener('click', e=>{
        navigator.clipboard.writeText(sec.commands.join('\n')).then(()=>{ e.target.textContent='Copied'; setTimeout(()=>e.target.textContent='Copy',1400); }).catch(()=>{});
      });
      secEl.appendChild(box);
    }
    if(sec.workflow){
      const wf = document.createElement('div'); wf.className = 'workflow';
      wf.innerHTML = sec.workflow.map((s,i)=>`<div class="wf-step"><span class="wf-dot"></span><span class="wf-text">${s}</span></div>${i<sec.workflow.length-1?'<div class="wf-line"></div>':''}`).join('');
      secEl.appendChild(wf);
    }
    if(sec.note){
      const n = document.createElement('div'); n.className = `note note-${sec.note.type}`;
      n.innerHTML = `<span>${NOTE_ICON[sec.note.type]}</span><span>${sec.note.text}</span>`;
      n.style.marginBottom = '18px'; secEl.appendChild(n);
    } else secEl.style.paddingBottom = '2px';
    root.appendChild(secEl);
  });
  updateRing();
}
function updateRing(){
  const done = Object.keys(progress).filter(k=>progress[k]).length;
  document.getElementById('progressNum').textContent = `${done}/${TOTAL}`;
  deUpdateRing(document.getElementById('ringFill'), done, TOTAL);
}
function toggleItem(n){
  if(progress[n]) delete progress[n]; else progress[n] = true;
  deWriteStore(ITEMS_KEY, progress);
  deSyncTopicToRoadmap(TOPIC_ID, TOTAL);
  render();
}
document.getElementById('search').addEventListener('input', e=>{ query = e.target.value; render(); });
// refresh when coming back from an item page
window.addEventListener('focus', ()=>{ progress = deReadStore(ITEMS_KEY); render(); });
window.addEventListener('pageshow', ()=>{ progress = deReadStore(ITEMS_KEY); render(); });
render();
</script>
</body>
</html>
